<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mondrian Project</title>
  <style>
    /* 
    Write your CSS here 
    Gap Colour: #000
    White: #F0F1EC
    Red: #E72F24
    Black: #232629
    Blue: #004592
    Yellow: #F9D01E

    For dimensions, see dimensions.png image.
    HINT: Remember you can't change the properties of grid lines.
    But grid lines are transparent!
    */
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      padding: 0;
    }
    .container{
      display: grid;
      background-color: black;
      height: 746px;
      width: 748px;
      grid-template-columns: 320px 198px 153px 50px;
      grid-template-rows: 414px 130px 155px 20px;
      gap:9px;

    }
    .one{
      background-color: #E72F24;
    }
    .two{
      background-color: #F0F1EC;
      grid-area:1/ 2/ 2/5;
    }
    .three{
      background-color: #F0F1EC;
      grid-area:2/1/4/2;
    }
    .four{
      background-color: #F0F1EC;
      grid-area:2/2/4/4;
    }
    .five{
      background-color: #004592;
      border-bottom: 5px solid black;
    }
    .six{
      background-color: #F0F1EC;
      grid-row: span 2;
    }
    .seven{
      background-color: #F9D01E;
    }
    .eight{
      background-color: #232629;
    }
    .nine{
      background-color: #F0F1EC;
    }
  </style>
</head>

<body>
  <!-- Write your HTML here -->
  <div class="mondrian container">
    <div class="mondrian items one"></div>
    <div class="mondrian items two"></div>
    <div class="mondrian items three"></div>
    <div class="mondrian items four"></div>
    <div class="mondrian items five"></div>
    <div class="mondrian items six"></div>
    <div class="mondrian items nine"></div>
    <div class="mondrian items seven"></div>
    <div class="mondrian items eight"></div>
    
  </div>

</body>

</html>
